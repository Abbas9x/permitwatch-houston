# Render Blueprint: one free web service serving the API and the built frontend (same origin).
# Render > New > Blueprint > pick this repo. It will ask for GEMINI_API_KEY (never commit it).
services:
  - type: web
    name: permitwatch-houston
    runtime: node
    plan: free
    # Build the app, then build the SQLite DB from the real dataset. AI summaries already generated
    # are restored from data/ai-snapshot.json, so deploys don't spend the Gemini free-tier quota.
    buildCommand: npm ci --include=dev && npm run build && npm run import:prod -- data/concrete-plants.json --snapshot data/ai-snapshot.json
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.3
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MOCK
        value: "off"
      - key: GEMINI_MODEL_ROUTER
        value: gemini-3.1-flash-lite
      - key: GEMINI_MODEL_SMALL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_LARGE
        value: gemini-3.8-flash
      - key: GEMINI_THINKING_ROUTER
        value: minimal
      - key: GEMINI_THINKING_SMALL
        value: minimal
      - key: GEMINI_THINKING_LARGE
        value: low
      - key: DATABASE_PATH
        value: ./data/permitwatch.db
      # The service's own URL (RENDER_EXTERNAL_URL) is added automatically at runtime.
      - key: ALLOWED_ORIGINS
        value: https://permitwatch-houston.onrender.com
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: info
