# Render Blueprint: one free web service serving the API and the built frontend (same origin).
# Render > New > Blueprint > pick this repo. No API key is required.
services:
  - type: web
    name: permitwatch-houston
    runtime: node
    plan: free
    # Build the app and import the real permit dataset with data-only summaries.
    buildCommand: npm ci --include=dev && npm run build && npm run import:prod -- data/sites.json
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.3
      - key: DATABASE_PATH
        value: ./data/permitwatch.db
      # The service's own URL (RENDER_EXTERNAL_URL) is added automatically at runtime.
      - key: ALLOWED_ORIGINS
        value: https://permitwatch-houston.onrender.com
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: info
